name: Build and publish public demo
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to the existing FinancialSummary AWS stack
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: financial-summary-demo
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run prepare:hosting
      - run: python -m pip install cfn-lint==1.57.2
      - run: cfn-lint deployment/FinancialSummaryHosting.template.json
      - run: python -m py_compile scripts/publish-demo.py
      - run: npm run build:demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-summary-public-demo
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: financial-summary-cloudformation
          path: deployment/FinancialSummaryHosting.template.json
  publish:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-2
      SITE_BUCKET: ${{ vars.DEMO_SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.DEMO_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.DEMO_SITE_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: financial-summary-public-demo
          path: dist/
      - name: Check stack outputs are configured
        env:
          ROLE_ARN: ${{ vars.DEMO_PUBLISH_ROLE_ARN }}
        run: |
          test -n "$ROLE_ARN"
          test -n "$SITE_BUCKET"
          test -n "$DISTRIBUTION_ID"
          test -n "$SITE_URL"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.DEMO_PUBLISH_ROLE_ARN }}
          role-session-name: FinancialSummaryDemo
          aws-region: us-east-2
          allowed-account-ids: '397303793146'
          role-duration-seconds: 900
      - run: python scripts/publish-demo.py
